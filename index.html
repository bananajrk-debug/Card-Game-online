<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ドカ食い大決戦！〜最重への道〜</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #fff3e0;
      color: #333;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #e65100; }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: 20px auto;
    }
    input, button {
      font-size: 16px;
      padding: 10px 15px;
      margin: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #ff9800;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background-color: #f57c00; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    
    /* ボードデザイン */
    .board {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }
    .tile {
      width: 100px;
      height: 90px;
      background: #ffe0b2;
      border: 2px solid #fb8c00;
      border-radius: 8px;
      font-size: 12px;
      padding: 5px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .tile-minigame { background: #ffcdd2; border-color: #e53935; }
    .player-tag {
      font-weight: bold;
      background: #e65100;
      color: white;
      border-radius: 4px;
      font-size: 10px;
      padding: 2px;
      margin-top: 2px;
    }

    /* オーバーレイ共通 */
    .overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      color: white;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 100;
    }

    /* サイコロの巨大表示 */
    #dice-number {
      font-size: 130px;
      font-weight: bold;
      color: #ffeb3b;
      text-shadow: 0 0 20px #ff9800, 0 0 40px #e65100;
      margin: 10px 0;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    #eat-btn {
      font-size: 24px;
      padding: 20px 40px;
      background-color: #e53935;
    }
    #log {
      height: 100px;
      overflow-y: auto;
      border: 1px solid #ccc;
      background: #fafafa;
      text-align: left;
      padding: 10px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- タイトル画面 -->
  <div id="title-screen" class="card">
    <h1>🍕 ドカ食い大決戦 🍔</h1>
    <p>〜 目指せ最高体重！〜</p>
    <input type="text" id="player-name" placeholder="プレイヤー名を入力" />
    <button onclick="joinGame()">ゲームに参加する</button>
  </div>

  <!-- ロビー画面 -->
  <div id="lobby-screen" class="card" style="display: none;">
    <h2>待機部屋</h2>
    <p>参加中のプレイヤー:</p>
    <ul id="player-list" style="list-style: none; padding: 0;"></ul>
    <button id="start-btn" onclick="startGame()">ゲームを開始する！</button>
  </div>

  <!-- ゲーム画面 -->
  <div id="game-screen" style="display: none;">
    <div class="card">
      <h2>現在のターン: <span id="current-turn-player" style="color: #e65100;">-</span></h2>
      <button id="roll-btn" onclick="rollDice()" disabled>🎲 サイコロを振る！</button>
    </div>

    <!-- ステータス表示 -->
    <div class="card">
      <h3>プレイヤー体重一覧</h3>
      <div id="status-list"></div>
    </div>

    <!-- すごろく盤面 -->
    <div class="card">
      <h3>すごろくマップ</h3>
      <div class="board" id="board"></div>
    </div>

    <!-- ゲームログ -->
    <div class="card">
      <h3>進行ログ</h3>
      <div id="log"></div>
    </div>
  </div>

  <!-- サイコロの巨大表示用オーバーレイ -->
  <div id="dice-overlay" class="overlay">
    <h2 id="dice-player-name">〇〇のターン！</h2>
    <div id="dice-number">🎲</div>
    <p id="dice-tile-info" style="font-size: 22px; font-weight: bold;"></p>
  </div>

  <!-- ミニゲーム用ポップアップ -->
  <div id="minigame-overlay" class="overlay">
    <h2>🍖 大食い連打バトル！ 🍖</h2>
    <p>ボタンを連打して料理を食いまくれ！一番連打できた人が+3kg！</p>
    <button id="eat-btn" onclick="clickEat()">食う！！！ (クリック連打)</button>
    <p>あなたのクリック数: <span id="click-count">0</span></p>
  </div>

  <script>
    const socket = io();
    let myId = '';
    let localClickCount = 0;

    const TILE_NAMES = [
      'スタート', 'ラーメン', 'ランニング', 'ケーキ', 'ミニゲーム',
      '断食道場', '夜食ポテチ', 'バイキング', 'ミニゲーム', '食っちゃ寝',
      'ジム', 'ビール唐揚げ', 'ミニゲーム', '高級焼肉', 'ゴール'
    ];

    socket.on('connect', () => { myId = socket.id; });

    function joinGame() {
      const name = document.getElementById('player-name').value;
      socket.emit('joinGame', name);
      document.getElementById('title-screen').style.display = 'none';
      document.getElementById('lobby-screen').style.display = 'block';
    }

    function startGame() {
      socket.emit('startGame');
    }

    function rollDice() {
      document.getElementById('roll-btn').disabled = true;
      socket.emit('rollDice');
    }

    function clickEat() {
      localClickCount++;
      document.getElementById('click-count').innerText = localClickCount;
      socket.emit('minigameClick');
    }

    // 状態更新
    socket.on('updateGameState', (state) => {
      if (state.started) {
        document.getElementById('lobby-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
      }

      // ロビーのプレイヤー一覧
      const pList = document.getElementById('player-list');
      pList.innerHTML = state.players.map(p => `<li>👤 ${p.name}</li>`).join('');

      // 手番判定
      const currentPlayer = state.players[state.turnIndex];
      if (currentPlayer) {
        document.getElementById('current-turn-player').innerText = currentPlayer.name;
        document.getElementById('roll-btn').disabled = (currentPlayer.id !== socket.id || state.inMinigame);
      }

      // 体重ステータス
      const statusList = document.getElementById('status-list');
      statusList.innerHTML = state.players.map(p => 
        `<div><strong>${p.name}</strong>: ${p.weight.toFixed(1)} kg ${p.isGoal ? '(ゴール!)' : ''}</div>`
      ).join('');

      // ボード描画
      const board = document.getElementById('board');
      board.innerHTML = '';
      TILE_NAMES.forEach((name, idx) => {
        const isMinigame = name === 'ミニゲーム';
        const tileDiv = document.createElement('div');
        tileDiv.className = `tile ${isMinigame ? 'tile-minigame' : ''}`;
        
        let playersOnTile = state.players
          .filter(p => p.position === idx)
          .map(p => `<div class="player-tag">${p.name}</div>`)
          .join('');

        tileDiv.innerHTML = `<div><strong>${idx}. ${name}</strong></div><div>${playersOnTile}</div>`;
        board.appendChild(tileDiv);
      });
    });

    // サイコロ演出の受信
    socket.on('diceRolled', (data) => {
      const diceOverlay = document.getElementById('dice-overlay');
      const diceNum = document.getElementById('dice-number');
      const playerName = document.getElementById('dice-player-name');
      const tileInfo = document.getElementById('dice-tile-info');

      playerName.innerText = `${data.playerName} がサイコロを振った！`;
      tileInfo.innerText = '';
      diceOverlay.style.display = 'flex';

      // シャッフル演出（数字がパラパラ変わる）
      let count = 0;
      const interval = setInterval(() => {
        diceNum.innerText = Math.floor(Math.random() * 6) + 1;
        count++;
        if (count > 10) {
          clearInterval(interval);
          // 確定の数字を表示
          diceNum.innerText = data.dice;
          tileInfo.innerText = `「${data.tileName}」に到着！`;

          // 2秒後にポップアップを消す
          setTimeout(() => {
            diceOverlay.style.display = 'none';
          }, 2000);
        }
      }, 50);
    });

    // ミニゲーム開始
    socket.on('startMinigame', (data) => {
      localClickCount = 0;
      document.getElementById('click-count').innerText = '0';
      document.getElementById('minigame-overlay').style.display = 'flex';
      
      setTimeout(() => {
        document.getElementById('minigame-overlay').style.display = 'none';
      }, 5000);
    });

    // ログ表示
    socket.on('logMessage', (msg) => {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML += `<div>${msg}</div>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    });

    // ゲームオーバー
    socket.on('gameOver', (players) => {
      const ranking = [...players].sort((a, b) => b.weight - a.weight);
      let resultText = '🎉 ゲーム終了！最終結果 🎉\n\n';
      ranking.forEach((p, idx) => {
        resultText += `第${idx + 1}位: ${p.name} (${p.weight.toFixed(1)} kg)\n`;
      });
      alert(resultText);
    });
  </script>
</body>
</html>
